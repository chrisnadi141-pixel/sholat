<style>
@keyframes warnaWarniGlow {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }

}

.quote-box {
  position: relative;
  overflow: visible !important; 
  z-index: 1;

  height: 80vh;
  border-radius: 25px;

    #4285f4

<script>
  let hlsInstance = null;
  let isNearAdzan = false; 
  const streamUrl = 'https://cdn-globecast.akamaized.net/live/eds/saudi_quran/hls_roku/index.m3u8';

  function stopStreaming() {
    const video = document.getElementById('streamVideo');
    video.style.display = 'none';
    video.pause();
    if (hlsInstance) {
      hlsInstance.destroy();
      hlsInstance = null;
    }
  }

  function toggleStreaming() {
    if (isNearAdzan) return;

    const video = document.getElementById('streamVideo');
    const imgTengah = document.getElementById('gambarTengah');

    if (video.style.display === 'block') {
      stopStreaming();
      imgTengah.style.display = 'block';
    } else {
      video.style.display = 'block';
      imgTengah.style.display = 'block';
      if (Hls.isSupported()) {
        hlsInstance = new Hls();
        hlsInstance.loadSource(streamUrl);
        hlsInstance.attachMedia(video);
        hlsInstance.on(Hls.Events.MANIFEST_PARSED, function() {
          video.play().catch(e => console.log("Autoplay blocked:", e));
        });
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = streamUrl;
        video.addEventListener('loadedmetadata', function() {
          video.play();
        });
      }
    }
  }

  document.addEventListener('keydown', (e) => {
    const quoteOverlay = document.getElementById('quoteOverlay');
    const imgTengah = document.getElementById('gambarTengah');

    if (e.key === '1') {
      toggleFullscreen();
    }
    
    if (isNearAdzan && ['3', '4', '5'].includes(e.key)) {
      console.log('Fitur pengumuman dan streaming dinonaktifkan menjelang adzan.');
      return;
    }

    if (e.key === '3') {
      stopStreaming();
      if (imgTengah) {
        imgTengah.style.display = 'block';
        if (imgTengah.getAttribute('src') === 'pengumuman3.jpg') {
          imgTengah.setAttribute('src', 'nabawi1.jpg');
        } else {
          imgTengah.setAttribute('src', 'pengumuman3.jpg');
        }
      }
    }

    if (e.key === '4') {
      toggleStreaming();
    }
        
    if (e.key === '5') {
      stopStreaming();
      if (imgTengah) {
        imgTengah.style.display = 'block';
        if (imgTengah.getAttribute('src') === 'pengumuman5.jpg') {
          imgTengah.setAttribute('src', 'nabawi1.jpg');
        } else {
          imgTengah.setAttribute('src', 'pengumuman5.jpg');
        }
      }
    }

    if (e.key === '6') {
      if (quoteOverlay) {
        quoteOverlay.classList.toggle('active');
        const marqueeEl = quoteOverlay.querySelector('marquee');
        if (marqueeEl && quoteOverlay.classList.contains('active')) {
          marqueeEl.start();
        }
      }
    }

    if (e.key === '7') {
      const theme = document.getElementById("theme-link");
      if (theme) {
        if (theme.getAttribute("href") === "style2a.css") {
          theme.setAttribute("href", "style-S.css");
        } else {
          theme.setAttribute("href", "style2a.css");
        }
      }
    }

    if (e.key === 'Enter' || e.keyCode === 13) {
      toggleFullscreen();
    }
  }); 

  function toggleFullscreen() {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch((err) => {
        console.error(`Gagal masuk mode fullscreen: ${err.message}`);
      });
    } else {
      document.exitFullscreen();
    }
  }

  document.addEventListener('click', (e) => {
    if (e.target.tagName !== 'VIDEO') {
      toggleFullscreen();
    }
  });
</script>

<script>
setInterval(() => {
  const n = new Date();
  document.getElementById("hDisplay").textContent = String(n.getHours()).padStart(2, '0');
  document.getElementById("mDisplay").textContent = String(n.getMinutes()).padStart(2, '0');

  const hari = ["Minggu","Senin","Selasa","Rabu","Kamis","Jumat","Sabtu"];
  const bulan = ["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];

  const tanggalDisplay = document.getElementById("tanggalDisplay");
  if(tanggalDisplay) {
     tanggalDisplay.textContent = `${hari[n.getDay()]}, ${n.getDate()} ${bulan[n.getMonth()]} ${n.getFullYear()}`;
  }

  const hijriMonths = ["Muharram","Safar","Rabiul Awal","Rabiul Akhir","Jumadil Awal","Jumadil Akhir","Rajab","Sya'ban","Ramadhan","Syawal","Dzulqaidah","Dzulhijjah"];

  const d = new Date();
  const fmt = new Intl.DateTimeFormat('id-ID-u-ca-islamic-umalqura', { day:'numeric', month:'numeric', year:'numeric', weekday:'long' });

  const parts = fmt.formatToParts(d);
  const day = parts.find(p=>p.type==='day').value;
  const month = parts.find(p=>p.type==='month').value;
  const year = parts.find(p=>p.type==='year').value;

  const hijriDisplay = document.getElementById("hijriDisplay");
  if(hijriDisplay) {
     hijriDisplay.innerHTML = `${day} ${hijriMonths[month-1]} ${year} H`;
  }
}, 1000);  
</script>

<script>
function parseCSV(text){
  const lines = text.split(/\r?\n/).filter(l=>l.trim()!=="");
  lines.shift();
  return lines.map(line=>{
    const cells=[], cur={v:"",q:false};
    for(let c of line){
      if(c=='"'){cur.q=!cur.q;continue;}
      if(c==',' && !cur.q){cells.push(cur.v);cur.v='';continue;}
      cur.v+=c;
    }
    cells.push(cur.v);
    return cells.map(c=>c.trim());
  });
}

if (typeof rawData !== 'undefined') {
  const rows = parseCSV(rawData);
  function getTodayRow(){
    const now = new Date();
    const d = String(now.getDate()).padStart(2,'0');
    const m = String(now.getMonth()+1).padStart(2,'0');
    const y = now.getFullYear();
    const today = `${d}/${m}/${y}`;
    return rows.find(r => r[0].includes(today));
  }

  const today = getTodayRow();
  if(today){
    document.getElementById("imsak").textContent   = today[1];
    document.getElementById("subuh").textContent   = today[2];
    document.getElementById("dzuhur").textContent  = today[3];
    document.getElementById("ashar").textContent   = today[4];
    document.getElementById("maghrib").textContent = today[5];
    document.getElementById("isya").textContent    = today[6];

    window.jadwal = {
      subuh:today[2],
      dzuhur:today[3],
      ashar:today[4],
      maghrib:today[5],
      isya:today[6]
    };
  }
}
</script>

<script>
let modeIqomahActive = false;
let statusAdzan = {};

function updateCountdown(){
  if(!window.jadwal) return;

  // Gunakan waktu aktual
  const now = new Date();
  const today = new Date();
  const hariIni = now.getDay(); 

  const list = [
    { n:"Subuh",   t: jadwal.subuh },
    { n:"Dzuhur",  t: jadwal.dzuhur },
    { n:"Ashar",   t: jadwal.ashar },
    { n:"Maghrib", t: jadwal.maghrib },
    { n:"Isya",    t: jadwal.isya }
  ];

  let next = null;
  list.forEach(j => {
    const [h,m] = j.t.split(":");
    const d = new Date(today.getFullYear(), today.getMonth(), today.getDate(), parseInt(h), parseInt(m), 0);
    if(d > now && !next){
      next = {...j, d};
    }
  });

  if(!next){
    const [h,m] = jadwal.subuh.split(":");
    const besokSubuh = new Date(today.getFullYear(), today.getMonth(), today.getDate() + 1, parseInt(h), parseInt(m), 0);
    next = { n: "Subuh", d: besokSubuh };
  }

  const diff = next.d - now;
  const totalDetik = Math.floor(diff / 1000);                                              
  const h = String(Math.floor(diff / 3600000)).padStart(2,"0");
  const m = String(Math.floor((diff % 3600000) / 60000)).padStart(2,"0");
  const s = String(Math.floor((diff % 60000) / 1000)).padStart(2,"0");

  const countdownElement = document.getElementById("countdown");
  if(countdownElement) countdownElement.textContent = `${next.n.toUpperCase()} : ${h}:${m}:${s}`;

  const overlay = document.getElementById("universalOverlay");
  const overlayCD = document.getElementById("overlayCountdown");
  const overlayStatus = document.getElementById("overlayStatus");
  const imgIqomahBg = document.getElementById("imgIqomahBg");
  const jumatOverlay = document.getElementById("jumatOverlay");
  const jumatCD = document.getElementById("jumatCountdown");
  const beep = document.getElementById("beepAudio");

  // MODE IQOMAH sedang berjalan
  if(modeIqomahActive){
    isNearAdzan = true;
    stopStreaming();
    const sisa = window.iqomahEnd - new Date().getTime();
    if(sisa > 0){
      overlay.style.display = "flex";
      jumatOverlay.style.display = "none";
      if(imgIqomahBg) imgIqomahBg.style.display = "block";
      overlayStatus.textContent = "MENJELANG IQOMAH";
      overlayStatus.style.color = "white";
      overlayStatus.style.fontSize = "3rem";       
      
      const im = String(Math.floor(sisa/60000)).padStart(2,"0");
      const is = String(Math.floor((sisa%60000)/1000)).padStart(2,"0");
      overlayCD.textContent = `${im}:${is}`;
    } else {
      overlay.style.display = "none";
      modeIqomahActive = false;
      isNearAdzan = false; 
    }
    return;
  }

  // 5 MENIT SEBELUM ADZAN (1 s.d. 300 detik)
  if(totalDetik <= 300 && totalDetik > 0){
    isNearAdzan = true;
    stopStreaming();

    if(hariIni === 5 && next.n === "Dzuhur"){
      jumatOverlay.style.display = "flex";
      overlay.style.display = "none";
      jumatCD.textContent = `${m}:${s}`;
    } else {
      overlay.style.display = "flex";
      jumatOverlay.style.display = "none";
      if(imgIqomahBg) imgIqomahBg.style.display = "block";
      overlayStatus.textContent = "MENUJU ADZAN";
      overlayCD.textContent = `${m}:${s}`;
      overlayCD.style.color = "white"; 
    }
  }
  // SAAT TEPAT WAKTU ADZAN (0 detik)
  else if(totalDetik <= 0 && totalDetik >= -5){
    isNearAdzan = true;
    stopStreaming();
    if(beep) beep.play().catch(e=>{});

    if(hariIni === 5 && next.n === "Dzuhur"){
      modeIqomahActive = false;
      jumatOverlay.style.display = "flex";
      overlay.style.display = "none";
    } else {
      // Mulai Hitung Mundur Iqomah selama 8 Menit (480000 ms)
      modeIqomahActive = true;
      window.iqomahEnd = new Date().getTime() + 480000; 
    }
  }
  else {
    // KONDISI NORMAL
    overlay.style.display = "none";
    jumatOverlay.style.display = "none";
    isNearAdzan = false;
  }
}
setInterval(updateCountdown, 1000);
</script>

<script>
const hariBesar = [
  {n:"Isra Mi'raj Nabi (ﷺ)",m:1,d:16},
  {n:"Awal Ramadhan",m:2,d:19},
  {n:"Nuzulul Qur'an",m:3,d:7},
  {n:"Idul Fitri",m:3,d:20},
  {n:"Idul Adha",m:5,d:27},
  {n:"Tahun Baru Islam",m:6,d:16},
  {n:"Maulid Nabi (ﷺ)",m:8,d:25}
];

function updateHariBesar(){
  const now = new Date();
  let dekat = null, sel = 9999;
  hariBesar.forEach(h => {
    let t = new Date(now.getFullYear(), h.m-1, h.d);
    if (t < now) t.setFullYear(t.getFullYear()+1);
    let s = Math.ceil((t-now)/86400000);
    if (s < sel){ sel = s; dekat = h; }
  });
  const hbText = document.getElementById("hariBesarText");
  if(hbText && dekat) hbText.textContent = `${dekat.n} — ${sel} hari lagi`;
}
updateHariBesar();
</script>

<script>
// Pematikan Suara Adzan Otomatis saat pas jamnya
setInterval(() => {
  if (!window.jadwal) return;
  const now = new Date();
  const jamSekarang = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
  ["subuh","dzuhur","ashar","maghrib","isya"].forEach(w => {
    if (window.jadwal[w] === jamSekarang && !statusAdzan[w]) {
      statusAdzan[w] = true;
      const audio = document.getElementById("adzanAudio");
      if(audio) audio.play().catch(e => {});
    }
  });
}, 1000);

setInterval(() => {
  const n = new Date();
  if(n.getHours() === 0 && n.getMinutes() === 0) statusAdzan = {};
}, 60000);
</script>
